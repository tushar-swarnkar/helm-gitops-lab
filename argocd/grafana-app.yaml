apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
spec:
  project: default

  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: grafana
      targetRevision: 10.1.0
      helm:
        releaseName: grafana
        valueFiles:
          - $values/apps/grafana/values.yaml

    - repoURL: https://github.com/tushar-swarnkar/helm-gitops-lab/
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: grafana

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
